name: CI

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  translations:
    name: Translations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test translation guard
        run: npm run test:i18n
      - name: Resolve comparison base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          if [[ -n "$PR_BASE" ]]; then
            BASE=$(git merge-base "$PR_BASE" HEAD)
          elif [[ -n "$QUEUE_BASE" ]]; then
            BASE="$QUEUE_BASE"
          elif [[ -n "$PUSH_BASE" && ! "$PUSH_BASE" =~ ^0+$ ]] && git cat-file -e "$PUSH_BASE^{commit}"; then
            BASE="$PUSH_BASE"
          else
            BASE=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD)
          fi
          echo "I18N_BASE=$BASE" >> "$GITHUB_ENV"
      - name: Validate all languages and new UI strings
        run: npm run check:i18n -- --base "$I18N_BASE"
      - name: Check patch whitespace
        run: git diff --check "$I18N_BASE" HEAD

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  quality-gate:
    name: Quality gate
    if: always()
    needs: [translations, tests, build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check to pass
        env:
          TRANSLATIONS: ${{ needs.translations.result }}
          TESTS: ${{ needs.tests.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          test "$TRANSLATIONS" = success
          test "$TESTS" = success
          test "$BUILD" = success
