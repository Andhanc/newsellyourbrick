    <!-- Discover the auction's LCP image before the lazy route and locale chunks. -->
    <script id="auction-hero-preload">
      (function () {
        if (!/^\/auction(?:\/(?:bidding|pre-auction|ended))?\/?$/.test(location.pathname)) return
        var base = '%BASE_URL%images/sellyourbrick/about/mission-villa-'
        var preload = document.createElement('link')
        preload.rel = 'preload'
        preload.as = 'image'
        preload.type = 'image/webp'
        preload.href = base + '960.webp'
        preload.imageSrcset = [480, 960, 1536].map(function (width) { return base + width + '.webp ' + width + 'w' }).join(', ')
        preload.imageSizes = '100vw'
        preload.media = '(max-width: 768px)'
        preload.fetchPriority = 'high'
        document.head.appendChild(preload)
      })()
    </script>

    <script>
      (function () {
        try {
          if (sessionStorage.getItem('syb_cabinet_entry_pending') !== '1') return
          var path = location.pathname
          var show = path === '/oauth-bridge' || path === '/profile' || path.indexOf('/profile/') === 0 || path === '/owner-test' || path.indexOf('/owner-test/') === 0
          if (!show) {
            sessionStorage.removeItem('syb_cabinet_entry_pending')
            sessionStorage.removeItem('syb_cabinet_entry_started_at')
            return
          }
          document.documentElement.classList.add('cabinet-entry-boot')
          var preload = document.createElement('link')
          preload.rel = 'preload'
          preload.as = 'image'
          preload.href = '/images/sellyourbrick/about/about-hero-villa.jpg'
          document.head.appendChild(preload)
        } catch (e) {}
      })()
    </script>

    <script>
      (function () {
        try {
          if (!document.documentElement.classList.contains('cabinet-entry-boot')) return
          if (!sessionStorage.getItem('syb_cabinet_entry_started_at')) {
            sessionStorage.setItem('syb_cabinet_entry_started_at', String(Date.now()))
          }
          var lang = String(localStorage.getItem('i18nextLng') || 'ru').slice(0, 2)
          var copy = {
            ru: ['Добро пожаловать', 'Открываем ваш профиль'],
            en: ['Welcome', 'Opening your profile'],
            de: ['Willkommen', 'Ihr Profil wird geöffnet'],
            es: ['Bienvenido', 'Abriendo su perfil'],
            fr: ['Bienvenue', 'Ouverture de votre profil'],
            pl: ['Witamy', 'Otwieramy Twój profil'],
            sv: ['Välkommen', 'Öppnar din profil']
          }[lang] || ['Welcome', 'Opening your profile']
          var el = document.createElement('div')
          el.id = 'cabinet-entry-boot'
          el.className = 'cabinet-entry'
          el.setAttribute('role', 'status')
          el.innerHTML = '<div class="cabinet-entry__photo" aria-hidden="true"></div><div class="cabinet-entry__veil" aria-hidden="true"></div><div class="cabinet-entry__brand" aria-hidden="true"><span>Sell</span><span class="cabinet-entry__brand-accent">Your</span><span>Brick</span></div><div class="cabinet-entry__copy"><p class="cabinet-entry__kicker">SellYourBrick</p><p class="cabinet-entry__title"></p><p class="cabinet-entry__subtitle"></p><div class="cabinet-entry__rule" aria-hidden="true"><span class="cabinet-entry__rule-fill"></span></div></div>'
          el.querySelector('.cabinet-entry__title').textContent = copy[0]
          el.querySelector('.cabinet-entry__subtitle').textContent = copy[1]
          var photo = el.querySelector('.cabinet-entry__photo')
          photo.style.backgroundImage = 'linear-gradient(180deg, rgba(15, 23, 42, 0.18), rgba(15, 23, 42, 0.18)), url("/images/sellyourbrick/about/about-hero-villa.jpg")'
          photo.style.backgroundPosition = 'center 42%'
          photo.style.backgroundSize = 'cover'
          photo.style.backgroundRepeat = 'no-repeat'
          var started = Number(sessionStorage.getItem('syb_cabinet_entry_started_at') || Date.now())
          var fill = el.querySelector('.cabinet-entry__rule-fill')
          if (fill) fill.style.animationDelay = '-' + Math.max(0, Date.now() - started) + 'ms'
          document.body.appendChild(el)
        } catch (e) {}
      })()
    </script>
