<!DOCTYPE html>
<html lang="ru">
  <head>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"

    <link
      rel="preload"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"

  <body>
    <div id="root">
      <!-- Мгновенный скелетон до выполнения JS (без ключей сборки конфиг может грузиться с /api/config) -->
      <div class="app-html-boot-root">
        <div class="app-html-boot-banner" aria-hidden="true"></div>
        <p class="app-html-boot-note" lang="ru">Загрузка интерфейса…</p>

          <div class="app-html-boot-card"></div>
          <div class="app-html-boot-card"></div>
          <div class="app-html-boot-card"></div>
          <div class="app-html-boot-card"></div>
          <div class="app-html-boot-card"></div>
          <div class="app-html-boot-card"></div>
        </div>
      </div>
    </div>
    <!-- Buffer polyfill для @ton/core и других Node-библиотек в браузере -->
    <script type="module">
      import { Buffer } from 'buffer';
      if (typeof window !== 'undefined') window.Buffer = Buffer;
      if (typeof globalThis !== 'undefined') globalThis.Buffer = Buffer;
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
