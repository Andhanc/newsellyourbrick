url: ${APP_URL}
name: guest-catalog-sections
tags:
  - guest
  - catalog
env:
  APP_URL: http://localhost:5173
  AUCTION_SLUG: maestro-demo-auction-villa
  BUY_NOW_SLUG: maestro-demo-buy-now-loft
  DEBT_SLUG: maestro-demo-debt-townhouse
  SHARE_SLUG: maestro-demo-share-penthouse
---
- launchApp
- openLink: ${APP_URL}/auction
- extendedWaitUntil:
    visible: ".*"
    timeout: 25000
- takeScreenshot: guest_auction
- openLink: ${APP_URL}/auction/buy-now
- extendedWaitUntil:
    visible: ".*"
    timeout: 25000
- takeScreenshot: guest_buy_now
- openLink: ${APP_URL}/debts
- extendedWaitUntil:
    visible: ".*"
    timeout: 25000
- takeScreenshot: guest_debts
- openLink: ${APP_URL}/co-investment
- extendedWaitUntil:
    visible: ".*"
    timeout: 25000
- takeScreenshot: guest_shares
- openLink: ${APP_URL}/auction/property/${AUCTION_SLUG}
- extendedWaitUntil:
    visible: ".*"
    timeout: 30000
- takeScreenshot: guest_auction_detail
- openLink: ${APP_URL}/property/${BUY_NOW_SLUG}
- extendedWaitUntil:
    visible: ".*"
    timeout: 30000
- takeScreenshot: guest_buy_now_detail
- openLink: ${APP_URL}/debts/property/${DEBT_SLUG}
- extendedWaitUntil:
    visible: ".*"
    timeout: 30000
- takeScreenshot: guest_debt_detail
- openLink: ${APP_URL}/co-investment/${SHARE_SLUG}
- extendedWaitUntil:
    visible: ".*"
    timeout: 30000
- takeScreenshot: guest_share_detail
- openLink: ${APP_URL}/map
- extendedWaitUntil:
    visible: ".*"
    timeout: 25000
- takeScreenshot: guest_map
- openLink: ${APP_URL}/search-results
- extendedWaitUntil:
    visible: ".*"
    timeout: 25000
- takeScreenshot: guest_search
- openLink: ${APP_URL}/favorites
- extendedWaitUntil:
    visible: ".*"
    timeout: 20000
- takeScreenshot: guest_favorites
- openLink: ${APP_URL}/compare
- extendedWaitUntil:
    visible: ".*"
    timeout: 20000
- takeScreenshot: guest_compare
