    visible: ".*"
    timeout: 20000
- takeScreenshot: buyer_bookings
- openLink: ${APP_URL}/wallet
- extendedWaitUntil:
    visible: ".*"
    timeout: 20000
- takeScreenshot: buyer_wallet
- openLink: ${APP_URL}/bonuses
- extendedWaitUntil:
    visible: ".*"
    timeout: 20000
- takeScreenshot: buyer_bonuses
- openLink: ${APP_URL}/favorites
