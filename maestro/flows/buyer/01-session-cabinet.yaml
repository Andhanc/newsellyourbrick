- openLink: ${APP_URL}/__e2e__/session?role=buyer&next=/profile
- extendedWaitUntil:
    visible: ".*"
    timeout: 30000
- takeScreenshot: buyer_profile
- openLink: ${APP_URL}/profile?data=1
